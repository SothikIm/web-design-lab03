<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<style>
			*{
				padding: 0;
				margin: 0;
				box-sizing: border-box;
			}

			body{
				padding: 0.5rem;
				height: 100vh;
			}

			.container{
				height: 100%;
				font-weight: 800;
				color: white;
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}

			header, footer{
				border-radius: 0.5rem;
				padding: 1em;
				height: 50px;
			}

			header{
				background-color: #1e90ff;
				box-shadow: inset -3px -3px #0077ea, inset 3px 1px #0077ea;
			}

			footer{
				background-color: #4169e1;
				box-shadow: inset -3px -3px #1d44b8, inset 3px 1px #1d44b8;
			}

			section{
				flex-grow: 1;
				display: flex;
				gap: 1rem;
			}

			main{
				border-radius: 0.5rem;
				padding: 1rem;
				flex-grow: 1;
				background-color: #3cb371;
				display: flex;
				flex-direction: column;
				gap: 1rem;
				box-shadow: inset -3px -3px #2f8d59, -3px -1px  #2f8d59;
			}

			.main-section{
				display: flex;
				flex-direction: row;
				gap: 1rem;
				flex-wrap: wrap;
			}
			
			.item{
				font-size: 1rem;
				border-radius: .5rem;
				background-color: #2f8d59;
				display: flex;
				justify-content: center;
				align-items: center;
				width: 50px;
				height: 50px;
				box-shadow: inset -2px -2px #226741, -2px -1px  #226741;
			}
			
			.sidebar{
				width: 100px;
				padding: 1rem;
				border-radius: 0.5rem;
				background-color: #ff6347;
				box-shadow: inset -2px -2px #e02200, -2px -1px  #e02200;
			}

		</style>
	</head>
	<body>
		<div class="container">
			<header>Header</header>
			<section class="div">
				<main>
					<p>Main</p>
					<div class="main-section">
						<div class="item">Item</div>
						<div class="item">Item</div>
						<div class="item">Item</div>
						<div class="item">Item</div>
						<div class="item">Item</div>
						<div class="item">Item</div>
						<div class="item">Item</div>
						<div class="item">Item</div>
						<div class="item">Item</div>
						<div class="item">Item</div>
						<div class="item">Item</div>
						<div class="item">Item</div>
						<div class="item">Item</div>
						<div class="item">Item</div>
					</div>
				</main>
				<div class="sidebar">Sidebar</div>
			</section>
			<footer>Footer</footer>
		</div>
	</body>
</html>
